name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          node-version: 20
      - name: Tool versions
        run: |
          bash --version | head -1
          jq --version
          python3 --version
          git --version
      - name: Syntax
        run: |
          for f in install.sh uninstall.sh bootstrap.sh lib/*.sh templates/*.sh skills/*/scripts/*.sh tests/*.sh vscode/*.sh; do bash -n "$f"; done
          python3 -m py_compile hooks/skill-router.py docs/diagrams/*.py
          for f in templates/*.json; do jq -e . "$f" >/dev/null; done
      - name: Shellcheck
        if: matrix.os == 'ubuntu-latest'
        run: shellcheck -S warning tests/*.sh lib/*.sh
      - name: Plugin and marketplace manifests
        run: |
          v="$(cat VERSION)"
          jq -e --arg v "$v" '.name=="kaizen" and .version==$v' .claude-plugin/plugin.json >/dev/null
          jq -e --arg v "$v" '.name=="jb-kaizen" and (.plugins|length==1)
            and .plugins[0].name=="kaizen" and .plugins[0].source=="./"
            and .plugins[0].version==$v' .claude-plugin/marketplace.json >/dev/null
          jq -e '.hooks.UserPromptSubmit[0].hooks[0].command|test("CLAUDE_PLUGIN_ROOT")' \
            hooks/hooks.json >/dev/null
          test -f skills/kaizen-setup/SKILL.md
      - name: claude plugin validate
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 5
        run: |
          npm i -g @anthropic-ai/claude-code >/dev/null 2>&1 || {
            echo "claude CLI unavailable in CI - manifest validation skipped"; exit 0; }
          out="$(claude plugin validate . </dev/null 2>&1)" || {
            printf '%s\n' "$out"
            case "$out" in
              *"not authenticated"*|*"Not authenticated"*|*"Invalid API key"*|*"ANTHROPIC_API_KEY"*|\
              *"claude login"*|*"credentials"*)
                echo "claude plugin validate needs auth in CI - skipped"; exit 0 ;;
            esac
            exit 1; }
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q 'Validation passed'
      - name: Diagrams are generated from their sources
        run: |
          python3 docs/diagrams/build.py
          git diff --exit-code -- docs/assets/diagrams || { echo 'docs/assets/diagrams is out of date: run python3 docs/diagrams/build.py and commit'; exit 1; }
      - name: Smoke test (install into a throwaway HOME, run every script)
        run: bash tests/smoke.sh
      - name: Bundled .vsix matches package.json
        run: |
          for e in claude-launcher graphify-watch; do v="$(jq -r .version "vscode/$e/package.json")"; test -f "vscode/$e/$e-$v.vsix" || { echo "missing vscode/$e/$e-$v.vsix"; exit 1; }; done
      - name: No personal paths or private names leaked
        run: |
          ! grep -rnE '/Users/bogda[n]|bogdan\.jaminski|jaminski\.ua' --exclude-dir=.git --exclude-dir=__pycache__ . || { echo "personal path leaked"; exit 1; }

  vscode:
    name: vscode companions (graphify-watch lint + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: vscode/graphify-watch
      - run: npm run lint && npm test
        working-directory: vscode/graphify-watch
