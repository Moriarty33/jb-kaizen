<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="JB Kaizen - your Claude Code setup gets better every night">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151a3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1010" cy="330" r="300" fill="url(#glow)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 80H1280M0 160H1280M0 240H1280M0 320H1280M0 400H1280M0 480H1280M0 560H1280"/>
    <path d="M80 0V640M160 0V640M240 0V640M320 0V640M400 0V640M480 0V640M560 0V640M640 0V640M720 0V640M800 0V640M880 0V640M960 0V640M1040 0V640M1120 0V640M1200 0V640"/>
  </g>

  <!-- wordmark -->
  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="88" y="96" width="112" height="112" rx="26" fill="url(#accent)"/>
    <text x="144" y="177" text-anchor="middle" font-size="60" font-weight="800" fill="#0b1020">JB</text>
    <text x="224" y="146" font-size="30" font-weight="600" fill="#94a3b8" letter-spacing="6">KAIZEN</text>
    <text x="224" y="196" font-size="44" font-weight="800" fill="#f8fafc">for Claude Code</text>

    <text x="88" y="286" font-size="40" font-weight="700" fill="#e2e8f0">Your setup gets better every night.</text>
    <text x="88" y="336" font-size="24" fill="#94a3b8">A nightly job reads your commits, PR reviews and sessions,</text>
    <text x="88" y="370" font-size="24" fill="#94a3b8">then rewrites your skills and agents - evidence first, snapshot always.</text>

    <!-- loop diagram -->
    <g transform="translate(88 430)">
      <g>
        <rect x="0" y="0" width="200" height="70" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="100" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#7dd3fc">EVIDENCE</text>
        <text x="100" y="53" text-anchor="middle" font-size="14" fill="#cbd5e1">commits · PRs · sessions</text>
      </g>
      <path d="M204 35H256" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
      <g transform="translate(260 0)">
        <rect x="0" y="0" width="200" height="70" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="100" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#c4b5fd">PROPOSE · VERIFY</text>
        <text x="100" y="53" text-anchor="middle" font-size="14" fill="#cbd5e1">multi-agent, 2-of-3</text>
      </g>
      <path d="M464 35H516" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
      <g transform="translate(520 0)">
        <rect x="0" y="0" width="200" height="70" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="100" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#86efac">APPLY</text>
        <text x="100" y="53" text-anchor="middle" font-size="14" fill="#cbd5e1">snapshot → edit → journal</text>
      </g>
      <path d="M724 35H776" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
      <g transform="translate(780 0)">
        <rect x="0" y="0" width="200" height="70" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="100" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#fcd34d">TOMORROW</text>
        <text x="100" y="53" text-anchor="middle" font-size="14" fill="#cbd5e1">fewer tokens, fewer retries</text>
      </g>
    </g>

    <text x="1192" y="596" text-anchor="end" font-size="16" fill="#64748b">github.com/Moriarty33 · MIT</text>
  </g>
</svg>
